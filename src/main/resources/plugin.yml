name: Wayfinder
version: ${version}
main: io.github.eskopp.wayfinder.WayfinderPlugin
api-version: "26.3"
authors: [eskopp]
description: Personal waypoints with teleportation
website: https://github.com/eskopp/wayfinder

commands:
  wf:
    description: Manage your personal waypoints
    aliases: [wayfinder]
    usage: /wf <set|tp|list|delete|tpa|tpahere|accept|deny|help> [name|player|x y z]
    permission: wayfinder.use

permissions:
  wayfinder.use:
    description: Use the /wf command
    default: true
  wayfinder.set:
    description: Create waypoints
    default: true
  wayfinder.tp:
    description: Teleport to waypoints
    default: true
  wayfinder.delete:
    description: Delete waypoints
    default: true
  wayfinder.tpa:
    description: Send teleport requests to other players
    default: true
  wayfinder.tpahere:
    description: Ask other players to teleport to you
    default: true
  wayfinder.tp.coords:
    description: Teleport to arbitrary coordinates
    default: op
  wayfinder.tpa.accept:
    description: Accept or deny teleport requests
    default: true
